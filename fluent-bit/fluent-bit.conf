[SERVICE]
    Daemon                      Off
    Flush                       5
    Log_Level                   info
    Parsers_File                /fluent-bit/parsers.conf
    Plugins_File                /fluent-bit/plugins.conf

[INPUT]
    Name                        tail
    Path                        /var/log/app/*.log
    Parser                      json
    Tag                         app.*
    Read_from_Head              On
    Refresh_Interval            5
    Mem_Buf_Limit               50MB
    Skip_Long_Lines             On

[INPUT]
    Name                        tail
    Path                        /var/log/nginx/access.log
    Parser                      nginx
    Tag                         nginx.access
    Refresh_Interval            5
    Mem_Buf_Limit               50MB

[INPUT]
    Name                        tail
    Path                        /var/log/nginx/error.log
    Tag                         nginx.error
    Refresh_Interval            5
    Mem_Buf_Limit               50MB

[FILTER]
    Name                        modify
    Match                       app.*
    Add                         host ${HOSTNAME}
    Add                         cluster docker-observability

[FILTER]
    Name                        modify
    Match                       nginx.*
    Add                         host ${HOSTNAME}
    Add                         cluster docker-observability

[OUTPUT]
    Name                        loki
    Match                       app.*
    Host                        loki
    Port                        3100
    Uri                         /loki/api/v1/push
    Labels                      service=go-app,host=${HOSTNAME}
    Auto_Kubernetes_Labels      false
    Remove_Keys                 host,cluster

[OUTPUT]
    Name                        loki
    Match                       nginx.*
    Host                        loki
    Port                        3100
    Uri                         /loki/api/v1/push
    Labels                      service=nginx,host=${HOSTNAME}
    Auto_Kubernetes_Labels      false
    Remove_Keys                 host,cluster
